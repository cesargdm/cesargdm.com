name: Deploy

# Replaces Vercel's Git integration, which stopped applying when the site moved
# to Cloudflare Workers. Requires a CLOUDFLARE_API_TOKEN repository secret with
# Workers Scripts:Edit and Workers AI:Read.
on:
  push:
    branches: [main]
  # The home page is prerendered, so the Goodreads, Bluesky, Strava, Unsplash
  # and NFT cards are baked in at build time. A daily rebuild keeps them fresh —
  # they all cache for 24h anyway, so this matches their TTL.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The prerender runs here, not on the deployed Worker, so it cannot see
      # Worker secrets — `wrangler secret put` alone leaves the keyed cards
      # (Unsplash, OpenSea, Slack, Strava) blank in the built HTML. Wrangler
      # reads .dev.vars during the build, so the same values have to exist here
      # as repository secrets. Missing ones just leave their card hidden.
      - name: Provide build-time secrets
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          for name in UNSPLASH_ACCESS_KEY OPENSEA_API_KEY SLACK_TOKEN SLACK_USER_ID \
                      STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_REFRESH_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .dev.vars
            else
              echo "::warning::$name is not set — its card will be blank in this build"
            fi
          done

      # Prerendering reads the content at build time, so the deployed HTML is
      # only as fresh as this step.
      - run: bun run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
