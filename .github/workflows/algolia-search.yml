name: Algolia search index

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Algolia indexes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh English index
        run: curl -fsS "https://cesargdm.com/api/crons/search?locale=en"
      - name: Refresh Spanish index
        run: curl -fsS "https://cesargdm.com/api/crons/search?locale=es"
